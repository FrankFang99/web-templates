<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYON-style 流体丝绸 · 模板 001 v4</title>
<style>
  :root {
    --bg: #d0d4da;
    --text: #1a1d22;
    --text-muted: rgba(26, 29, 34, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    cursor: crosshair;
  }
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud > * { pointer-events: auto; }
  .nav { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
  .logo::before { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text); }
  .nav-links { display: flex; gap: 32px; font-size: 14px; color: var(--text-muted); }
  .nav-links a { color: inherit; text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-cta { padding: 8px 18px; border: 1px solid var(--text); border-radius: 6px; font-size: 14px; font-weight: 500; }
  .hero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 720px; padding: 0 24px; }
  .eyebrow { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.05em; }
  .title { font-family: 'Times New Roman', 'Source Han Serif', serif; font-style: italic; font-size: clamp(36px, 5vw, 64px); font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; }
  .desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; }
  .input-bar { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 100px; padding: 8px 8px 8px 24px; width: min(720px, calc(100% - 48px)); }
  .input-bar input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: var(--text); }
  .input-bar input::placeholder { color: var(--text-muted); }
  .input-bar button { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .side-tip { position: absolute; bottom: 80px; right: 24px; font-size: 12px; color: var(--text-muted); font-family: monospace; }
  canvas { position: fixed; inset: 0; z-index: 1; display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <nav class="nav">
    <div class="logo">BYON</div>
    <div class="nav-links">
      <a href="#">项目</a><a href="#">场次</a><a href="#">社区</a><a href="#">关于</a>
    </div>
    <a href="#" class="nav-cta">进入 BYON</a>
  </nav>
  <div class="hero">
    <div class="eyebrow">空载社区</div>
    <h1 class="title">Bring Your Own Nothing.</h1>
    <p class="desc">这是一个开放的 AI 创造社区。<br>你可以在此独立想法、表达需求、寻找同伴，<br>也可以把尚未完成的产品，直接交给世界验证。</p>
  </div>
  <div class="side-tip">move your mouse</div>
  <form class="input-bar" onsubmit="event.preventDefault()">
    <input type="text" placeholder="登录后参与讨论" />
    <button aria-label="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></button>
  </form>
</div>

<script>
/*
 * BYON-style 流体丝绸 · v4
 * 关键修复（vs v3）：
 *   1. FS_EXTERNAL_FORCE 用 uCenter（不再是 vUv-0.5）→ 力真正跟随鼠标
 *   2. Force pass 用 ADDITIVE BLENDING（blendFunc ONE, ONE）→ vel_1 += force
 *   3. Step 顺序修正：advect → force(add) → divergence → poisson → gradSub
 *   4. 跳过 viscous 迭代（byonlab 默认 isViscous=false）
 *   5. mouse_force = 20（byonlab 默认值）
 *   6. 真正的自动巡航：lerp 到随机目标 → 持续产生 P.diff → 持续 silk
 *
 * 算法：Jos Stam (1999) "Stable Fluids" + BFECC
 * 数据：byonlab.com bundle (1.3MB) 反混淆分析
 */

// ========== Shader 编译工具 ==========
function compileShader(gl, type, src) {
  const s = gl.createShader(type)
  gl.shaderSource(s, src)
  gl.compileShader(s)
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s), '\n--- src ---\n', src)
    throw new Error('shader compile failed')
  }
  return s
}
function makeProgram(gl, vs, fs) {
  const p = gl.createProgram()
  gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vs))
  gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fs))
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(p))
    throw new Error('program link failed')
  }
  return p
}

// ========== FBO（支持 float 纹理）==========
function createFBO(gl, w, h, internalFormat, format, type, param) {
  gl.activeTexture(gl.TEXTURE0)
  const texture = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, texture)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null)

  const fbo = gl.createFramebuffer()
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo)
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0)
  gl.viewport(0, 0, w, h)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)

  const texelSizeX = 1.0 / w
  const texelSizeY = 1.0 / h
  return {
    texture, fbo, width: w, height: h, texelSizeX, texelSizeY,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id }
  }
}
function createDoubleFBO(gl, w, h, ifmt, fmt, type, param) {
  let fbo1 = createFBO(gl, w, h, ifmt, fmt, type, param)
  let fbo2 = createFBO(gl, w, h, ifmt, fmt, type, param)
  return {
    get read() { return fbo1 },
    get write() { return fbo2 },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t }
  }
}

// ========== 全屏 quad VAO ==========
function createQuadVAO(gl) {
  const vao = gl.createVertexArray()
  gl.bindVertexArray(vao)
  const buf = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, buf)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, -1,1, 1,1, 1,-1]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  const ibo = gl.createBuffer()
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo)
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW)
  gl.bindVertexArray(null)
  return vao
}

// ========== Shaders ==========
const VS_QUAD = `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`

// 1) Advection (BFECC) — Jos Stam semi-Lagrangian
const FS_ADVECTION = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform float uDt;
uniform bool uIsBFECC;
uniform vec2 uFboSize;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 ratio = max(uFboSize.x, uFboSize.y) / uFboSize;
  if (!uIsBFECC) {
    vec2 vel = texture(uVelocity, vUv).xy;
    vec2 uv2 = vUv - vel * uDt * ratio;
    vec2 newVel = texture(uVelocity, uv2).xy;
    fragColor = vec4(newVel, 0.0, 0.0);
  } else {
    vec2 spot_new = vUv;
    vec2 vel_old = texture(uVelocity, vUv).xy;
    vec2 spot_old = spot_new - vel_old * uDt * ratio;
    vec2 vel_new1 = texture(uVelocity, spot_old).xy;
    vec2 spot_new2 = spot_old + vel_new1 * uDt * ratio;
    vec2 error = spot_new2 - spot_new;
    vec2 spot_new3 = spot_new - error / 2.0;
    vec2 vel_2 = texture(uVelocity, spot_new3).xy;
    vec2 spot_old2 = spot_new3 - vel_2 * uDt * ratio;
    vec2 newVel2 = texture(uVelocity, spot_old2).xy;
    fragColor = vec4(newVel2, 0.0, 0.0);
  }
}`

// 2) External force —— v4 修复：用 uCenter 让力真正跟随鼠标
// uCenter 范围 [-1, 1]（NDC 空间）
// uScale 范围 (0, 1]（NDC 空间，作为刷子半径）
const FS_EXTERNAL_FORCE = `#version 300 es
precision highp float;
uniform vec2 uForce;
uniform vec2 uCenter;
uniform vec2 uScale;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 ndc = (vUv - 0.5) * 2.0;
  vec2 offset = (ndc - uCenter) / max(uScale, vec2(0.0001));
  float d = 1.0 - min(length(offset), 1.0);
  d *= d;
  fragColor = vec4(uForce * d, 0.0, 1.0);  // alpha=1 → additive blend 写入
}`

// 3) Divergence
const FS_DIVERGENCE = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform float uDt;
uniform vec2 uPx;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float x0 = texture(uVelocity, vUv - vec2(uPx.x, 0.0)).x;
  float x1 = texture(uVelocity, vUv + vec2(uPx.x, 0.0)).x;
  float y0 = texture(uVelocity, vUv - vec2(0.0, uPx.y)).y;
  float y1 = texture(uVelocity, vUv + vec2(0.0, uPx.y)).y;
  float div = (x1 - x0 + y1 - y0) / 2.0;
  fragColor = vec4(div / uDt);
}`

// 4) Pressure (Jacobi)
const FS_PRESSURE = `#version 300 es
precision highp float;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uPx;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float p0 = texture(uPressure, vUv + vec2(uPx.x * 2.0, 0.0)).r;
  float p1 = texture(uPressure, vUv - vec2(uPx.x * 2.0, 0.0)).r;
  float p2 = texture(uPressure, vUv + vec2(0.0, uPx.y * 2.0)).r;
  float p3 = texture(uPressure, vUv - vec2(0.0, uPx.y * 2.0)).r;
  float div = texture(uDivergence, vUv).r;
  float newP = (p0 + p1 + p2 + p3) / 4.0 - div;
  fragColor = vec4(newP);
}`

// 5) Pressure gradient subtract
const FS_GRADIENT_SUBTRACT = `#version 300 es
precision highp float;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uPx;
uniform float uDt;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float p0 = texture(uPressure, vUv + vec2(uPx.x, 0.0)).r;
  float p1 = texture(uPressure, vUv - vec2(uPx.x, 0.0)).r;
  float p2 = texture(uPressure, vUv + vec2(0.0, uPx.y)).r;
  float p3 = texture(uPressure, vUv - vec2(0.0, uPx.y)).r;
  vec2 v = texture(uVelocity, vUv).xy;
  vec2 gradP = vec2(p0 - p1, p2 - p3) * 0.5;
  v = v - gradP * uDt;
  fragColor = vec4(v, 0.0, 1.0);
}`

// 6) Render — vel.length → pow 放大 → 调色板查色 → mix(bgColor, color, length)
const FS_RENDER = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform sampler2D uPalette;
uniform vec4 uBgColor;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 vel = texture(uVelocity, vUv).xy;
  float lenv = clamp(length(vel), 0.0, 1.0);
  // pow 0.5 = 平方根放大，让小速度值也有可见对比
  lenv = pow(lenv, 0.5);
  vec3 c = texture(uPalette, vec2(lenv, 0.5)).rgb;
  vec3 outRGB = mix(uBgColor.rgb, c, lenv);
  float outA = mix(uBgColor.a, 1.0, lenv);
  fragColor = vec4(outRGB, outA);
}`

// ========== 调色板：bg 灰 → 中亮 → 极亮白（高对比让 silk 可见）==========
function makePaletteTexture(gl) {
  const W = 256
  const tex = gl.createTexture()
  gl.activeTexture(gl.TEXTURE0)
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  const data = new Uint8Array(W * 4)
  for (let i = 0; i < W; i++) {
    const t = i / (W - 1)
    // 高对比 3-stop：bg 灰(208) → 中银(235) → 极亮(255)
    let r, g, b
    if (t < 0.5) {
      const k = t / 0.5
      r = 208 + (235 - 208) * k
      g = 212 + (238 - 212) * k
      b = 218 + (243 - 218) * k
    } else {
      const k = (t - 0.5) / 0.5
      r = 235 + (255 - 235) * k
      g = 238 + (255 - 238) * k
      b = 243 + (255 - 243) * k
    }
    data[i*4] = r
    data[i*4+1] = g
    data[i*4+2] = b
    data[i*4+3] = 255
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data)
  return tex
}

// ========== 初始化 ==========
const canvas = document.getElementById('c')
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false })
if (!gl) { alert('需要 WebGL2 浏览器'); throw new Error('no webgl2') }
gl.getExtension('EXT_color_buffer_float')

let W, H, simW, simH
function resize() {
  W = window.innerWidth
  H = window.innerHeight
  simW = Math.max(1, Math.round(W * 0.5))
  simH = Math.max(1, Math.round(H * 0.5))
  canvas.width = W
  canvas.height = H
  initFBOs()
}

// byonlab 默认参数
const SIM_PARAMS = {
  dt: 0.014,
  iterations_poisson: 32,
  mouse_force: 20,        // byonlab 默认 20
  cursor_size: 0.2,       // NDC 空间，0.2 = 20% 屏幕宽度的刷子
  isViscous: false,       // byonlab 默认 false（性能）
}

let vel, div, pressure, palette
const programs = {}
let quadVAO

function initPrograms() {
  programs.advection = makeProgram(gl, VS_QUAD, FS_ADVECTION)
  programs.force = makeProgram(gl, VS_QUAD, FS_EXTERNAL_FORCE)
  programs.divergence = makeProgram(gl, VS_QUAD, FS_DIVERGENCE)
  programs.pressure = makeProgram(gl, VS_QUAD, FS_PRESSURE)
  programs.gradSub = makeProgram(gl, VS_QUAD, FS_GRADIENT_SUBTRACT)
  programs.render = makeProgram(gl, VS_QUAD, FS_RENDER)
}

function initFBOs() {
  const ifmt = gl.RG16F
  const fmt = gl.RG
  const type = gl.HALF_FLOAT
  const param = gl.LINEAR
  vel = createDoubleFBO(gl, simW, simH, ifmt, fmt, type, param)
  const ifmtD = gl.R16F
  const fmtD = gl.RED
  div = createDoubleFBO(gl, simW, simH, ifmtD, fmtD, type, param)
  pressure = createDoubleFBO(gl, simW, simH, ifmtD, fmtD, type, param)
  palette = makePaletteTexture(gl)
}

initPrograms()
quadVAO = createQuadVAO(gl)
resize()
window.addEventListener('resize', resize)

// ========== 鼠标 + 自动巡航 ==========
// NDC 空间 [-1, 1]，byonlab 风格
const pointer = {
  x: 0.5, y: 0.5,        // 当前目标位置（NDC）
  prevX: 0.5, prevY: 0.5, // 上一帧位置
  dx: 0, dy: 0,           // delta (NDC)
  userActive: false,      // 用户是否在操作
  lastUserTime: 0,
  // 自动巡航
  autoTarget: { x: 0, y: 0 },
  autoActive: false,
  autoStartTime: 0,
  autoRampMs: 1500,
}

function setMouseFromClient(clientX, clientY) {
  pointer.x = (clientX / W) * 2 - 1
  pointer.y = -((clientY / H) * 2 - 1)
  pointer.userActive = true
  pointer.lastUserTime = performance.now()
}

window.addEventListener('mousemove', (e) => {
  setMouseFromClient(e.clientX, e.clientY)
})
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    setMouseFromClient(e.touches[0].clientX, e.touches[0].clientY)
  }
}, { passive: true })

// 自动巡航：1.5s 用户无操作 → 开始自动旋转
function startAutoPilot() {
  pointer.autoActive = true
  pointer.autoStartTime = performance.now()
  // 随机选一个目标点
  const m = 0.7  // margin
  pointer.autoTarget.x = (Math.random() * 2 - 1) * m
  pointer.autoTarget.y = (Math.random() * 2 - 1) * m
}

function updateAutoPilot(now) {
  if (pointer.userActive && (now - pointer.lastUserTime) > 1500 && !pointer.autoActive) {
    startAutoPilot()
  }
  if (pointer.autoActive) {
    // lerp 0.04 速度比 byonlab 默认 0.015 快一点 → silk 更明显
    pointer.x += (pointer.autoTarget.x - pointer.x) * 0.04
    pointer.y += (pointer.autoTarget.y - pointer.y) * 0.04
    // 接近目标 → 选新目标
    const dx = pointer.autoTarget.x - pointer.x
    const dy = pointer.autoTarget.y - pointer.y
    if (Math.sqrt(dx*dx + dy*dy) < 0.05) {
      pointer.autoTarget.x = (Math.random() * 2 - 1) * 0.7
      pointer.autoTarget.y = (Math.random() * 2 - 1) * 0.7
    }
  }
}

// ========== 渲染流程 ==========
function drawPass(prog, fbo) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo)
  gl.viewport(0, 0, fbo.width, fbo.height)
  gl.useProgram(prog)
  gl.bindVertexArray(quadVAO)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
}

function step() {
  // 0) 算 mouse delta（NDC 空间）
  pointer.dx = pointer.x - pointer.prevX
  pointer.dy = pointer.y - pointer.prevY
  pointer.prevX = pointer.x
  pointer.prevY = pointer.y

  // 1) Advect: vel.read → vel.write (BFECC)
  gl.useProgram(programs.advection)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.advection, 'uVelocity'), 0)
  gl.uniform1f(gl.getUniformLocation(programs.advection, 'uDt'), SIM_PARAMS.dt)
  gl.uniform1i(gl.getUniformLocation(programs.advection, 'uIsBFECC'), 1)
  gl.uniform2f(gl.getUniformLocation(programs.advection, 'uFboSize'), vel.read.width, vel.read.height)
  drawPass(programs.advection, vel.write)
  vel.swap()
  // 现在 vel.read 包含 advect 后的速度

  // 2) External force —— ADDITIVE BLEND：vel.read += force * d
  gl.useProgram(programs.force)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.force, 'uVelocity'), 0)
  // byonlab 用 P.diff/2 * mouse_force，但实际效果偏小；这里 *2 让 silk 更明显
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uForce'),
    pointer.dx * SIM_PARAMS.mouse_force * 2.0,
    pointer.dy * SIM_PARAMS.mouse_force * 2.0)
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uCenter'), pointer.x, pointer.y)
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uScale'),
    SIM_PARAMS.cursor_size, SIM_PARAMS.cursor_size)
  gl.bindFramebuffer(gl.FRAMEBUFFER, vel.read.fbo)
  gl.viewport(0, 0, vel.read.width, vel.read.height)
  gl.useProgram(programs.force)
  gl.bindVertexArray(quadVAO)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.ONE, gl.ONE)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
  gl.disable(gl.BLEND)
  // vel.read 现在 = advect + force

  // 3) Divergence(vel.read) → div.write
  gl.useProgram(programs.divergence)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.divergence, 'uVelocity'), 0)
  gl.uniform1f(gl.getUniformLocation(programs.divergence, 'uDt'), SIM_PARAMS.dt)
  gl.uniform2f(gl.getUniformLocation(programs.divergence, 'uPx'),
    1.0 / vel.read.width, 1.0 / vel.read.height)
  drawPass(programs.divergence, div.write)
  div.swap()

  // 4) Pressure Jacobi 32 iter
  for (let i = 0; i < SIM_PARAMS.iterations_poisson; i++) {
    gl.useProgram(programs.pressure)
    pressure.read.attach(0)
    div.read.attach(1)
    gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uPressure'), 0)
    gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uDivergence'), 1)
    gl.uniform2f(gl.getUniformLocation(programs.pressure, 'uPx'),
      1.0 / pressure.read.width, 1.0 / pressure.read.height)
    drawPass(programs.pressure, pressure.write)
    pressure.swap()
  }

  // 5) Pressure gradient subtract: vel.write = vel.read - gradP
  gl.useProgram(programs.gradSub)
  pressure.read.attach(0)
  vel.read.attach(1)
  gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uPressure'), 0)
  gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uVelocity'), 1)
  gl.uniform2f(gl.getUniformLocation(programs.gradSub, 'uPx'),
    1.0 / vel.write.width, 1.0 / vel.write.height)
  gl.uniform1f(gl.getUniformLocation(programs.gradSub, 'uDt'), SIM_PARAMS.dt)
  drawPass(programs.gradSub, vel.write)
  vel.swap()
}

function render() {
  gl.useProgram(programs.render)
  vel.read.attach(0)
  gl.activeTexture(gl.TEXTURE1)
  gl.bindTexture(gl.TEXTURE_2D, palette)
  gl.uniform1i(gl.getUniformLocation(programs.render, 'uVelocity'), 0)
  gl.uniform1i(gl.getUniformLocation(programs.render, 'uPalette'), 1)
  // bgColor 跟 CSS body 保持一致（#e8ebef ≈ 232/255, 235/255, 239/255, 1.0）
  gl.uniform4f(gl.getUniformLocation(programs.render, 'uBgColor'), 208/255, 212/255, 218/255, 1.0)
  gl.bindFramebuffer(gl.FRAMEBUFFER, null)
  gl.viewport(0, 0, W, H)
  gl.bindVertexArray(quadVAO)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
  gl.disable(gl.BLEND)
}

// ========== 主循环 ==========
let frameCount = 0
function loop() {
  frameCount++
  const now = performance.now()
  updateAutoPilot(now)
  step()
  render()
  if (frameCount % 60 === 0) {
    console.log(`frame ${frameCount} mouse=(${pointer.x.toFixed(2)},${pointer.y.toFixed(2)}) dx=${pointer.dx.toFixed(4)}`)
  }
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)
</script>
</body>

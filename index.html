<style>

<body>

<canvas id="c"></canvas>

<div class="hud">

<script>
/*
 * BYON-style 流体丝绸 · v7
 *
 * 核心改造（vs v6.4）：
 *   1. 丢掉 Phong / normal 估计 / 3D 阴影整套 → 改用 byonlab 原版极简 render
 *      gl_FragColor = mix(bgColor.rgb, palette(length(vel)), length(vel))
 *      整个丝绸质感全部来自 palette 贴图
 *   2. 丢掉的 3D 计算正是 v6.4 碎纹的根因：高频 velocity 场做 normal 估计 = 颗粒噪声
 *   3. Force brush 改为 byonlab (1-r)² 圆形 brush（之前用 exp(-2.5r²) Gaussian 也算 OK，
 *      但 (1-r)² 是 byonlab 用的形状，跟 simulation 更搭）
 *   4. 仿真参数对齐 byonlab 默认：cursor_size 100, viscous 30, iterations_viscous 32
 *   5. bgColor 改为 #e2e8f0（byonlab 同款冷调灰蓝）
 *   6. 取消 simulation 后面的 render-stage blur（byonlab 没有）
 *   7. Render 直接读 vel_0（simulation 输出的最终速度）
 *
 * 算法：Jos Stam (1999) "Stable Fluids" + BFECC
 * 数据：byonlab.com bundle (1.3MB) 反混淆分析
 */

// ========== Shader 编译工具 ==========
function compileShader(gl, type, src) {
  const s = gl.createShader(type)
  gl.shaderSource(s, src)
  gl.compileShader(s)
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(s), '\n--- src ---\n', src)
    throw new Error('shader compile failed')
  }
  return s
}
function makeProgram(gl, vs, fs) {
  const p = gl.createProgram()
  gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vs))
  gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fs))
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(p))
    throw new Error('program link failed')
  }
  return p
}

// ========== FBO（支持 float 纹理）==========
function createFBO(gl, w, h, internalFormat, format, type, param) {
  gl.activeTexture(gl.TEXTURE0)
  const texture = gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, texture)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null)

  const fbo = gl.createFramebuffer()
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo)
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0)
  gl.viewport(0, 0, w, h)
  gl.clearColor(0, 0, 0, 1)
  gl.clear(gl.COLOR_BUFFER_BIT)

  const texelSizeX = 1.0 / w
  const texelSizeY = 1.0 / h
  return {
    texture, fbo, width: w, height: h, texelSizeX, texelSizeY,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id }
  }
}
function createDoubleFBO(gl, w, h, ifmt, fmt, type, param) {
  let fbo1 = createFBO(gl, w, h, ifmt, fmt, type, param)
  let fbo2 = createFBO(gl, w, h, ifmt, fmt, type, param)
  return {
    get read() { return fbo1 },
    get write() { return fbo2 },
    swap() { const t = fbo1; fbo1 = fbo2; fbo2 = t }
  }
}

// ========== 全屏 quad VAO ==========
function createQuadVAO(gl) {
  const vao = gl.createVertexArray()
  gl.bindVertexArray(vao)
  const buf = gl.createBuffer()
  gl.bindBuffer(gl.ARRAY_BUFFER, buf)
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, -1,1, 1,1, 1,-1]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0)
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  const ibo = gl.createBuffer()
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo)
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW)
  gl.bindVertexArray(null)
  return vao
}

// ========== Shaders ==========
const VS_QUAD = `#version 300 es
precision highp float;
in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`

// 1) Advection (BFECC) — Jos Stam semi-Lagrangian（保留 v6.4 同款）
const FS_ADVECTION = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform float uDt;
uniform bool uIsBFECC;
uniform vec2 uFboSize;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 ratio = max(uFboSize.x, uFboSize.y) / uFboSize;
  if (!uIsBFECC) {
    vec2 vel = texture(uVelocity, vUv).xy;
    vec2 uv2 = vUv - vel * uDt * ratio;
    vec2 newVel = texture(uVelocity, uv2).xy;
    fragColor = vec4(newVel, 0.0, 0.0);
  } else {
    vec2 spot_new = vUv;
    vec2 vel_old = texture(uVelocity, vUv).xy;
    vec2 spot_old = spot_new - vel_old * uDt * ratio;
    vec2 vel_new1 = texture(uVelocity, spot_old).xy;
    vec2 spot_new2 = spot_old + vel_new1 * uDt * ratio;
    vec2 error = spot_new2 - spot_new;
    vec2 spot_new3 = spot_new - error / 2.0;
    vec2 vel_2 = texture(uVelocity, spot_new3).xy;
    vec2 spot_old2 = spot_new3 - vel_2 * uDt * ratio;
    vec2 newVel2 = texture(uVelocity, spot_old2).xy;
    fragColor = vec4(newVel2, 0.0, 0.0);
  }
}`

// 2) External force —— byonlab Pe class 风格：(1-r)² 圆形 brush
// 关键：mesh 在 NDC 里以 (uCenter, uCenter) 为中心、(uScale, uScale) 为大小
// brush 内距离 r=0 处力最大（d=1），r=1 处力为零（d=0），r>1 处 d=0
// 力方向由 pointer delta 决定，幅度由 mouse_force 决定
// 圆形 brush 比 Gaussian 略"硬"，但 byonlab 用的就是这个，效果证明 OK
const FS_EXTERNAL_FORCE = `#version 300 es
precision highp float;
uniform vec2 uForce;
uniform vec2 uCenter;
uniform vec2 uScale;
in vec2 vUv;
out vec4 fragColor;
void main() {
  // vUv 是 [0,1] 的全屏 UV，转成 NDC [-1,1]
  vec2 ndc = (vUv - 0.5) * 2.0;
  // 转换到 brush 的 local space（按 uScale 归一化）
  vec2 local = (ndc - uCenter) / max(uScale, vec2(0.0001));
  float r = length(local);
  // byonlab (1-r)² falloff
  float d = 1.0 - min(r, 1.0);
  d *= d;
  fragColor = vec4(uForce * d, 0.0, 0.0);
}`

// 3) Divergence（v6.4 同款）
const FS_DIVERGENCE = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform float uDt;
uniform vec2 uPx;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float x0 = texture(uVelocity, vUv - vec2(uPx.x, 0.0)).x;
  float x1 = texture(uVelocity, vUv + vec2(uPx.x, 0.0)).x;
  float y0 = texture(uVelocity, vUv - vec2(0.0, uPx.y)).y;
  float y1 = texture(uVelocity, vUv + vec2(0.0, uPx.y)).y;
  float div = (x1 - x0 + y1 - y0) / 2.0;
  fragColor = vec4(div / uDt);
}`

// 4) Pressure (Jacobi)（v6.4 同款）
const FS_PRESSURE = `#version 300 es
precision highp float;
uniform sampler2D uPressure;
uniform sampler2D uDivergence;
uniform vec2 uPx;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float p0 = texture(uPressure, vUv + vec2(uPx.x * 2.0, 0.0)).r;
  float p1 = texture(uPressure, vUv - vec2(uPx.x * 2.0, 0.0)).r;
  float p2 = texture(uPressure, vUv + vec2(0.0, uPx.y * 2.0)).r;
  float p3 = texture(uPressure, vUv - vec2(0.0, uPx.y * 2.0)).r;
  float div = texture(uDivergence, vUv).r;
  float newP = (p0 + p1 + p2 + p3) / 4.0 - div;
  fragColor = vec4(newP);
}`

// 5) Pressure gradient subtract（v6.4 同款，去掉 drag）
const FS_GRADIENT_SUBTRACT = `#version 300 es
precision highp float;
uniform sampler2D uPressure;
uniform sampler2D uVelocity;
uniform vec2 uPx;
uniform float uDt;
in vec2 vUv;
out vec4 fragColor;
void main() {
  float p0 = texture(uPressure, vUv + vec2(uPx.x, 0.0)).r;
  float p1 = texture(uPressure, vUv - vec2(uPx.x, 0.0)).r;
  float p2 = texture(uPressure, vUv + vec2(0.0, uPx.y)).r;
  float p3 = texture(uPressure, vUv - vec2(0.0, uPx.y)).r;
  vec2 v = texture(uVelocity, vUv).xy;
  vec2 gradP = vec2(p0 - p1, p2 - p3) * 0.5;
  v = v - gradP * uDt;
  fragColor = vec4(v, 0.0, 1.0);
}`

// 5.5) Viscous diffusion（Jacobi 迭代，byonlab ot class）
// viscous 越大 → 越平滑；iterations_viscous 控制迭代次数
const FS_VISCOUS = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform sampler2D uVelocityNew;
uniform float uViscous;
uniform vec2 uPx;
uniform float uDt;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 old = texture(uVelocity, vUv).xy;
  vec2 new0 = texture(uVelocityNew, vUv + vec2(uPx.x * 2.0, 0.0)).xy;
  vec2 new1 = texture(uVelocityNew, vUv - vec2(uPx.x * 2.0, 0.0)).xy;
  vec2 new2 = texture(uVelocityNew, vUv + vec2(0.0, uPx.y * 2.0)).xy;
  vec2 new3 = texture(uVelocityNew, vUv - vec2(0.0, uPx.y * 2.0)).xy;
  vec2 newv = 4.0 * old + uViscous * uDt * (new0 + new1 + new2 + new3);
  newv /= 4.0 * (1.0 + uViscous * uDt);
  fragColor = vec4(newv, 0.0, 0.0);
}`

// 5.6) Render-stage tiny blur —— 3-tap 轻量 Gaussian
// v8: 比 v7.2 (5-tap 1px) 更轻，保留丝绸织物的细腻纹理
// 只抹掉单像素高频噪声，不影响整体形态
const FS_RENDER_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform vec2 uPx;
in vec2 vUv;
out vec4 fragColor;
void main() {
  // 3-tap 简单平均（center + 2 neighbors）→ 0.5px 等效 blur
  vec2 sum = vec2(0.0);
  sum += texture(uVelocity, vUv + vec2(uPx.x, 0.0)).xy * 1.0;
  sum += texture(uVelocity, vUv - vec2(uPx.x, 0.0)).xy * 1.0;
  sum += texture(uVelocity, vUv).xy * 6.0;
  fragColor = vec4(sum / 8.0, 0.0, 1.0);
}`

// 6) Render —— v7 极简版：byonlab 原版，没有 Phong / normal
// silk 感完全来自 palette 贴图和 bgColor 的搭配
// 之前 v6.4 的 Phong 估计 normal 是碎纹根因
const FS_RENDER = `#version 300 es
precision highp float;
uniform sampler2D uVelocity;
uniform sampler2D uPalette;
uniform vec4 uBgColor;
in vec2 vUv;
out vec4 fragColor;
void main() {
  vec2 vel = texture(uVelocity, vUv).xy;
  float lenv = clamp(length(vel), 0.0, 1.0);
  vec3 c = texture(uPalette, vec2(lenv, 0.5)).rgb;
  vec3 outRGB = mix(uBgColor.rgb, c, lenv);
  float outA = mix(uBgColor.a, 1.0, lenv);
  fragColor = vec4(outRGB, outA);
}`

// ========== 调色板：byonlab 丝绸感 1D 渐变 ==========
// 设计思路：
//   - t=0.0  暗区（silk 阴影）：冷调深灰蓝
//   - t=0.3  中间：稍亮的冷灰
//   - t=0.6  浅色（silk 本体）：与 bg 接近的冷灰
//   - t=1.0  高光：冷白（带极轻微蓝调）
// 用 64 个 stop 平滑过渡 → 没有 banding
function makePaletteTexture(gl) {
  const W = 64
  const tex = gl.createTexture()
  gl.activeTexture(gl.TEXTURE0)
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)

  // 4 段关键色：v7.1 调亮（之前太暗）→ 让 silk 明显但不碎
  // 设计思路：mix(bg, palette(t), t) 公式下
  //   t=0 时 → bg（最浅，几乎无 silk）
  //   t=0.3 时 → bg 的 70% + dark 的 30%（可见阴影）
  //   t=0.6 时 → 回到中间（silk body）
  //   t=1.0 时 → 白（强烈高光）
  // 这给屏幕一种"从浅到深再到白"的丝绸光泽感
  const stops = [
    { t: 0.00, rgb: [0.92, 0.94, 0.97] },   // 接近 bg（silk 边缘）
    { t: 0.30, rgb: [0.30, 0.34, 0.42] },   // 深冷灰（silk 阴影，最暗处）
    { t: 0.55, rgb: [0.55, 0.60, 0.70] },   // 中冷灰（silk 主体）
    { t: 0.80, rgb: [0.85, 0.88, 0.92] },   // 浅冷灰（silk 亮区）
    { t: 1.00, rgb: [0.99, 0.99, 1.00] },   // 冷白高光
  ]
  const data = new Uint8Array(W * 4)
  for (let i = 0; i < W; i++) {
    const t = i / (W - 1)
    // 找两段插值
    let a = stops[0], b = stops[stops.length - 1]
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s + 1].t) {
        a = stops[s]; b = stops[s + 1]; break
      }
    }
    const k = (t - a.t) / Math.max(0.0001, b.t - a.t)
    const r = a.rgb[0] + (b.rgb[0] - a.rgb[0]) * k
    const g = a.rgb[1] + (b.rgb[1] - a.rgb[1]) * k
    const bl = a.rgb[2] + (b.rgb[2] - a.rgb[2]) * k
    data[i*4]   = Math.round(r * 255)
    data[i*4+1] = Math.round(g * 255)
    data[i*4+2] = Math.round(bl * 255)
    data[i*4+3] = 255
  }
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data)
  return tex
}

// ========== 初始化 ==========
const canvas = document.getElementById('c')
const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false })
if (!gl) { alert('需要 WebGL2 浏览器'); throw new Error('no webgl2') }
gl.getExtension('EXT_color_buffer_float')

let W, H, simW, simH
function resize() {
  W = window.innerWidth
  H = window.innerHeight
  // v7: 0.5 resolution（byonlab 默认）
  simW = Math.max(1, Math.round(W * 0.5))
  simH = Math.max(1, Math.round(H * 0.5))
  canvas.width = W
  canvas.height = H
  initFBOs()
}

// v8: 整屏丝绸覆盖 —— 大 brush + 持续力 + 高粘度
// 关键变化：
//   cursor_size 0.18 → 0.45  (覆盖 45% 屏幕)
//   mouse_force 20 → 25  (silk 凸起更明显)
//   配合 Lissajous 连续路径 auto-pilot → silk 铺满整屏
const SIM_PARAMS = {
  dt: 0.014,
  iterations_poisson: 32,
  iterations_viscous: 32,    // 抗碎纹关键
  viscous: 30,
  mouse_force: 25,           // v8: 略大 → silk 更明显
  cursor_size: 0.45,         // v8: 大 brush → 整屏覆盖
  isViscous: true,
}

let vel, velViscous, velBlurred, div, pressure, palette
const programs = {}
let quadVAO

function initPrograms() {
  programs.advection = makeProgram(gl, VS_QUAD, FS_ADVECTION)
  programs.force = makeProgram(gl, VS_QUAD, FS_EXTERNAL_FORCE)
  programs.divergence = makeProgram(gl, VS_QUAD, FS_DIVERGENCE)
  programs.pressure = makeProgram(gl, VS_QUAD, FS_PRESSURE)
  programs.gradSub = makeProgram(gl, VS_QUAD, FS_GRADIENT_SUBTRACT)
  programs.viscous = makeProgram(gl, VS_QUAD, FS_VISCOUS)
  programs.renderBlur = makeProgram(gl, VS_QUAD, FS_RENDER_BLUR)  // v7.2 微纹理消除
  programs.render = makeProgram(gl, VS_QUAD, FS_RENDER)
}

function initFBOs() {
  const ifmt = gl.RG16F
  const fmt = gl.RG
  const type = gl.HALF_FLOAT
  const param = gl.LINEAR
  vel = createDoubleFBO(gl, simW, simH, ifmt, fmt, type, param)
  velViscous = createDoubleFBO(gl, simW, simH, ifmt, fmt, type, param)
  velBlurred = createFBO(gl, simW, simH, ifmt, fmt, type, param)  // v7.2 render 前 blur
  const ifmtD = gl.R16F
  const fmtD = gl.RED
  div = createDoubleFBO(gl, simW, simH, ifmtD, fmtD, type, param)
  pressure = createDoubleFBO(gl, simW, simH, ifmtD, fmtD, type, param)
  palette = makePaletteTexture(gl)
}

initPrograms()
quadVAO = createQuadVAO(gl)
resize()
window.addEventListener('resize', resize)

// ========== 鼠标 + 自动巡航 ==========
// v8: 连续 Lissajous 路径 auto-pilot（不停单点）→ silk 持续铺满整屏
const pointer = {
  x: 0.5, y: 0.5,
  prevX: 0.5, prevY: 0.5,
  dx: 0, dy: 0,
  userActive: false,
  lastUserTime: 0,
  autoActive: false,
  // v8: 连续路径状态
  autoStartTime: 0,
  // v8: 多 cursor trail（多个 ghost cursor 同时产生 silk）
  ghosts: [
    { phase: 0, omega: 0.7, amp: 0.7 },  // ghost 1
    { phase: Math.PI, omega: 0.5, amp: 0.6 },  // ghost 2 (180° 相位差)
  ],
}

function setMouseFromClient(clientX, clientY) {
  pointer.x = (clientX / W) * 2 - 1
  pointer.y = -((clientY / H) * 2 - 1)
  pointer.userActive = true
  pointer.lastUserTime = performance.now()
  pointer.autoActive = false
}

window.addEventListener('mousemove', (e) => {
  setMouseFromClient(e.clientX, e.clientY)
})
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    setMouseFromClient(e.touches[0].clientX, e.touches[0].clientY)
  }
}, { passive: true })

function startAutoPilot() {
  pointer.autoActive = true
  pointer.autoStartTime = performance.now()
  // 随机化每个 ghost 的初始相位，避免每次启动都同图
  for (const g of pointer.ghosts) {
    g.phase = Math.random() * Math.PI * 2
  }
}

function updateAutoPilot(now) {
  if (pointer.userActive && (now - pointer.lastUserTime) > 1500 && !pointer.autoActive) {
    startAutoPilot()
  }
  if (pointer.autoActive) {
    // v8: Lissajous 曲线（两个 ghost cursor 沿不同椭圆路径运动）→ silk 覆盖全屏
    const t = (now - pointer.autoStartTime) / 1000
    const g1 = pointer.ghosts[0]
    const g2 = pointer.ghosts[1]
    // ghost 1 主 cursor：宽椭圆，水平慢、垂直快
    const x1 = Math.cos(g1.phase + t * g1.omega) * g1.amp
    const y1 = Math.sin(g1.phase + t * g1.omega * 1.3) * g1.amp * 0.7
    // ghost 2：反向椭圆
    const x2 = Math.cos(g2.phase + t * g2.omega * 0.8) * g2.amp * 0.6
    const y2 = Math.sin(g2.phase + t * g2.omega) * g2.amp * 0.8
    // 平均两个 cursor 位置 → 主 cursor 位置
    // 这样 silk 不会停在单点，而是持续扫过整个屏幕
    pointer.x = (x1 + x2) * 0.5
    pointer.y = (y1 + y2) * 0.5
  }
}

// ========== 渲染流程 ==========
function drawPass(prog, fbo) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.fbo)
  gl.viewport(0, 0, fbo.width, fbo.height)
  gl.useProgram(prog)
  gl.bindVertexArray(quadVAO)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
}

function step() {
  // 0) 算 mouse delta（NDC 空间）
  pointer.dx = pointer.x - pointer.prevX
  pointer.dy = pointer.y - pointer.prevY
  pointer.prevX = pointer.x
  pointer.prevY = pointer.y

  // 1) Advect: vel.read → vel.write (BFECC)
  gl.useProgram(programs.advection)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.advection, 'uVelocity'), 0)
  gl.uniform1f(gl.getUniformLocation(programs.advection, 'uDt'), SIM_PARAMS.dt)
  gl.uniform1i(gl.getUniformLocation(programs.advection, 'uIsBFECC'), 1)
  gl.uniform2f(gl.getUniformLocation(programs.advection, 'uFboSize'), vel.read.width, vel.read.height)
  drawPass(programs.advection, vel.write)
  vel.swap()

  // 2) External force —— ADDITIVE BLEND：vel.read += force * d²
  gl.useProgram(programs.force)
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uForce'),
    pointer.dx * SIM_PARAMS.mouse_force,
    pointer.dy * SIM_PARAMS.mouse_force)
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uCenter'), pointer.x, pointer.y)
  gl.uniform2f(gl.getUniformLocation(programs.force, 'uScale'),
    SIM_PARAMS.cursor_size, SIM_PARAMS.cursor_size)
  gl.bindFramebuffer(gl.FRAMEBUFFER, vel.read.fbo)
  gl.viewport(0, 0, vel.read.width, vel.read.height)
  gl.bindVertexArray(quadVAO)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.ONE, gl.ONE)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
  gl.disable(gl.BLEND)

  // 3) Divergence(vel.read) → div.write
  gl.useProgram(programs.divergence)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.divergence, 'uVelocity'), 0)
  gl.uniform1f(gl.getUniformLocation(programs.divergence, 'uDt'), SIM_PARAMS.dt)
  gl.uniform2f(gl.getUniformLocation(programs.divergence, 'uPx'),
    1.0 / vel.read.width, 1.0 / vel.read.height)
  drawPass(programs.divergence, div.write)
  div.swap()

  // 4) Pressure Jacobi 32 iter
  for (let i = 0; i < SIM_PARAMS.iterations_poisson; i++) {
    gl.useProgram(programs.pressure)
    pressure.read.attach(0)
    div.read.attach(1)
    gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uPressure'), 0)
    gl.uniform1i(gl.getUniformLocation(programs.pressure, 'uDivergence'), 1)
    gl.uniform2f(gl.getUniformLocation(programs.pressure, 'uPx'),
      1.0 / pressure.read.width, 1.0 / pressure.read.height)
    drawPass(programs.pressure, pressure.write)
    pressure.swap()
  }

  // 5) Pressure gradient subtract: vel.write = vel.read - gradP * dt
  gl.useProgram(programs.gradSub)
  pressure.read.attach(0)
  vel.read.attach(1)
  gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uPressure'), 0)
  gl.uniform1i(gl.getUniformLocation(programs.gradSub, 'uVelocity'), 1)
  gl.uniform2f(gl.getUniformLocation(programs.gradSub, 'uPx'),
    1.0 / vel.write.width, 1.0 / vel.write.height)
  gl.uniform1f(gl.getUniformLocation(programs.gradSub, 'uDt'), SIM_PARAMS.dt)
  drawPass(programs.gradSub, vel.write)
  vel.swap()

  // 5.5) Viscous diffusion (byonlab ot class)：在 gradSub 之后做扩散
  // 高 viscous 值 + 多 iterations = 速度场被强平滑 → render 时没有高频 noise
  // 这是抗碎纹的关键（替代 v6.4 的 render-stage blur）
  for (let i = 0; i < SIM_PARAMS.iterations_viscous; i++) {
    gl.useProgram(programs.viscous)
    vel.read.attach(0)
    velViscous.read.attach(1)
    gl.uniform1i(gl.getUniformLocation(programs.viscous, 'uVelocity'), 0)
    gl.uniform1i(gl.getUniformLocation(programs.viscous, 'uVelocityNew'), 1)
    gl.uniform1f(gl.getUniformLocation(programs.viscous, 'uViscous'), SIM_PARAMS.viscous)
    gl.uniform2f(gl.getUniformLocation(programs.viscous, 'uPx'),
      1.0 / vel.read.width, 1.0 / vel.read.height)
    gl.uniform1f(gl.getUniformLocation(programs.viscous, 'uDt'), SIM_PARAMS.dt)
    drawPass(programs.viscous, velViscous.write)
    velViscous.swap()
  }
  // 把 viscous 的结果当作下次的 input
  // 注意：这里直接绑到 vel.read（用 assign 而不是 swap，因为 vel 还在别处用）
  vel.read = velViscous.read
}

function render() {
  // v7.2: render-stage 5-tap blur 1px → 消除 auto-pilot 路径的微纹理
  // blur 很轻（仅 1 sim 像素），silk 形态完全保留
  gl.useProgram(programs.renderBlur)
  vel.read.attach(0)
  gl.uniform1i(gl.getUniformLocation(programs.renderBlur, 'uVelocity'), 0)
  gl.uniform2f(gl.getUniformLocation(programs.renderBlur, 'uPx'),
    1.0 / vel.read.width, 1.0 / vel.read.height)
  drawPass(programs.renderBlur, velBlurred)

  // 用 velBlurred 做 palette lookup
  gl.useProgram(programs.render)
  velBlurred.attach(0)
  gl.activeTexture(gl.TEXTURE1)
  gl.bindTexture(gl.TEXTURE_2D, palette)
  gl.uniform1i(gl.getUniformLocation(programs.render, 'uVelocity'), 0)
  gl.uniform1i(gl.getUniformLocation(programs.render, 'uPalette'), 1)
  // bgColor: v8 改 #eef2f6（byonlab 实际看起来更白）
  gl.uniform4f(gl.getUniformLocation(programs.render, 'uBgColor'),
    0xEE / 255, 0xF2 / 255, 0xF6 / 255, 1.0)
  gl.bindFramebuffer(gl.FRAMEBUFFER, null)
  gl.viewport(0, 0, W, H)
  gl.bindVertexArray(quadVAO)
  gl.enable(gl.BLEND)
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0)
  gl.disable(gl.BLEND)
}

// ========== 主循环 ==========
let frameCount = 0
function loop() {
  frameCount++
  const now = performance.now()
  updateAutoPilot(now)
  step()
  render()
  if (frameCount % 60 === 0) {
    console.log(`frame ${frameCount} mouse=(${pointer.x.toFixed(2)},${pointer.y.toFixed(2)}) dx=${pointer.dx.toFixed(4)}`)
  }
  requestAnimationFrame(loop)
}
requestAnimationFrame(loop)
</script>
</body>

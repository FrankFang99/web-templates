<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BYON-style 丝绸布料 · 模板 001 v2</title>
<style>
  :root {
    --bg-top: #f4f5f7;
    --bg-bot: #d8dce3;
    --text: #1a1d22;
    --text-muted: rgba(26, 29, 34, 0.55);
    --accent: #2d4753;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    color: var(--text);
    cursor: crosshair;
  }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud > * { pointer-events: auto; }

  .nav {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px;
  }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; letter-spacing: 0.02em; }
  .logo::before { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text); }
  .nav-links { display: flex; gap: 32px; font-size: 14px; color: var(--text-muted); }
  .nav-links a { color: inherit; text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-cta { padding: 8px 18px; border: 1px solid var(--text); border-radius: 6px; font-size: 14px; font-weight: 500; }

  .hero { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 720px; padding: 0 24px; }
  .eyebrow { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; letter-spacing: 0.05em; }
  .title { font-family: 'Times New Roman', 'Source Han Serif', serif; font-style: italic; font-size: clamp(36px, 5vw, 64px); font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; }
  .desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; }

  .input-bar {
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 100px;
    padding: 8px 8px 8px 24px;
    width: min(720px, calc(100% - 48px));
  }
  .input-bar input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: var(--text); }
  .input-bar input::placeholder { color: var(--text-muted); }
  .input-bar button { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .side-tip { position: absolute; bottom: 80px; right: 24px; font-size: 12px; color: var(--text-muted); font-family: monospace; }

  canvas { position: fixed; inset: 0; z-index: 1; display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <nav class="nav">
    <div class="logo">BYON</div>
    <div class="nav-links">
      <a href="#">项目</a><a href="#">场次</a><a href="#">社区</a><a href="#">关于</a>
    </div>
    <a href="#" class="nav-cta">进入 BYON</a>
  </nav>

  <div class="hero">
    <div class="eyebrow">空载社区</div>
    <h1 class="title">Bring Your Own Nothing.</h1>
    <p class="desc">这是一个开放的 AI 创造社区。<br>你可以在此独立想法、表达需求、寻找同伴，<br>也可以把尚未完成的产品，直接交给世界验证。</p>
  </div>

  <div class="side-tip">move your mouse</div>

  <form class="input-bar" onsubmit="event.preventDefault()">
    <input type="text" placeholder="登录后参与讨论" />
    <button aria-label="lock"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></button>
  </form>
</div>

<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.182.0" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============ 场景：透视相机 + 高细分 plane 布料 ============
const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5))
renderer.setClearColor(0x000000, 0)  // 透明，让 body 渐变透出来

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100)
camera.position.set(0, -1.5, 4.5)
camera.lookAt(0, 0, 0)

// 高级细 plane —— 256x192 = 49152 顶点，足够细腻
const PLANE_W = 10
const PLANE_H = 6
const SEG_W = 256
const SEG_H = 192
const geo = new THREE.PlaneGeometry(PLANE_W, PLANE_H, SEG_W, SEG_H)

// ============ Uniforms ============
const uMouse = new THREE.Vector2(0.5, 0.5)       // 当前鼠标位置 (0-1)
const uMouseTarget = new THREE.Vector2(0.5, 0.5)  // 目标位置（lerp）

const uniforms = {
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uPlaneSize: { value: new THREE.Vector2(PLANE_W, PLANE_H) },
  uResolution: { value: new THREE.Vector2(1, 1) },
  uColorBase: { value: new THREE.Color('#eef0f3') },
  uColorShadow: { value: new THREE.Color('#a8aeba') },
  uColorHighlight: { value: new THREE.Color('#ffffff') },
  uMouseStrength: { value: 1.0 },
}

// ============ Mouse tracking ============
window.addEventListener('mousemove', (e) => {
  uMouseTarget.x = e.clientX / window.innerWidth
  uMouseTarget.y = 1.0 - (e.clientY / window.innerHeight)  // flip Y
})

// ============ Vertex shader：基础 FBM 噪声 + 鼠标下压 + 涟漪 ============
const vsh = `
#define SEG_W ${SEG_W}
#define SEG_H ${SEG_H}
precision highp float;

uniform float uTime;
uniform vec2 uMouse;
uniform vec2 uPlaneSize;
uniform float uMouseStrength;

varying vec2 vUv;
varying vec3 vNormal;
varying float vDepth;
varying float vMouseDist;

// 哈希 + 值噪声
float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
// FBM 4 层
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 4; i++) {
    v += a * noise(p);
    p *= 2.07;
    a *= 0.5;
  }
  return v;
}

// 计算总位移 = 基础褶皱 + 鼠标下压 + 涟漪扩散
float displacement(vec2 uv) {
  // 1) 基础褶皱：低频 FBM 模拟布料自然皱褶（幅度温和，silk 感）
  float baseFolds = (fbm(uv * 2.0 + vec2(uTime * 0.05, uTime * 0.04)) - 0.5) * 0.28
                  + (fbm(uv * 4.5 - vec2(uTime * 0.03, uTime * 0.035)) - 0.5) * 0.14
                  + (fbm(uv * 9.0 + vec2(uTime * 0.02, -uTime * 0.025)) - 0.5) * 0.06;

  // 2) 鼠标下压：中心有深谷，Gaussian（要看得见按下去）
  vec2 mouseUV = uMouse;
  vec2 d = (uv - mouseUV) * vec2(uPlaneSize.x / uPlaneSize.y, 1.0);
  float dist = length(d);
  float dip = -uMouseStrength * exp(-dist * dist * 4.0) * 1.2;

  // 3) 鼠标涟漪：从鼠标向外扩散的波
  float ripple = sin(dist * 12.0 - uTime * 3.0) * exp(-dist * 3.5) * 0.08;

  return baseFolds + dip + ripple;
}

void main() {
  vUv = uv;
  vec3 pos = position;

  // 计算 z 位移
  float d = displacement(uv);
  pos.z = d;

  // 计算鼠标距离（fragment 用）
  vMouseDist = length((uv - uMouse) * vec2(uPlaneSize.x / uPlaneSize.y, 1.0));
  vDepth = d;

  // 法线：在 UV 空间对 d 求偏导，再用偏导构造扰动法线
  float e = 0.003;
  float dX1 = displacement(uv + vec2(e, 0.0));
  float dX0 = displacement(uv - vec2(e, 0.0));
  float dY1 = displacement(uv + vec2(0.0, e));
  float dY0 = displacement(uv - vec2(0.0, e));
  // 因为 plane 在 XY 面、z 是高度，normal = normalize(cross(tangentX, tangentY))
  vec3 tangentX = vec3(2.0 * e * (uPlaneSize.x / float(SEG_W)), 0.0, dX1 - dX0);
  vec3 tangentY = vec3(0.0, 2.0 * e * (uPlaneSize.y / float(SEG_H)), dY1 - dY0);
  vNormal = normalize(cross(tangentX, tangentY));

  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`

// ============ Fragment shader：柔光 + 边缘阴影 + 鼠标高光 ============
const fsh = `
precision highp float;

uniform vec3 uColorBase;
uniform vec3 uColorShadow;
uniform vec3 uColorHighlight;
uniform vec2 uMouse;
uniform vec2 uPlaneSize;
uniform float uMouseStrength;

varying vec2 vUv;
varying vec3 vNormal;
varying float vDepth;
varying float vMouseDist;

void main() {
  // 软光照（主光从左上）—— 用半 lambert，silk 不需要硬阴影
  vec3 lightDir = normalize(vec3(-0.5, 0.7, 0.6));
  float NdotL = dot(vNormal, lightDir);
  float diff = max(0.0, NdotL * 0.55 + 0.55);  // 半 lambert（柔）

  // 顶光（从相机方向，给正面打光）
  vec3 viewDir = vec3(0.0, 0.0, 1.0);
  float NdotV = max(0.0, dot(vNormal, viewDir));
  float topLight = pow(NdotV, 1.0) * 0.35;

  // 软高光（很淡，silk 才会有的微微光泽）
  vec3 halfV = normalize(lightDir + viewDir);
  float spec = pow(max(0.0, dot(vNormal, halfV)), 18.0) * 0.25;

  // 鼠标周围一圈微微高光（突出交互点）
  float mouseRing = exp(-vMouseDist * vMouseDist * 14.0) * 0.3;

  // 基础色：根据光照 mix
  vec3 col = mix(uColorShadow, uColorBase, diff);
  col += uColorBase * topLight;
  col += uColorHighlight * spec;
  col += uColorHighlight * mouseRing;

  gl_FragColor = vec4(col, 1.0);
}
`

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: vsh,
  fragmentShader: fsh,
  side: THREE.DoubleSide,  // 布料背面也渲染（顶部看下去会透）
})

const mesh = new THREE.Mesh(geo, mat)
scene.add(mesh)

// ============ Resize ============
function resize() {
  const w = window.innerWidth
  const h = window.innerHeight
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  uniforms.uResolution.value.set(w, h)
}
resize()
window.addEventListener('resize', resize)

// ============ Animation loop ============
const clock = new THREE.Clock()
function tick() {
  const t = clock.getElapsedTime()

  // 鼠标 lerp（跟手重量）
  uMouse.x += (uMouseTarget.x - uMouse.x) * 0.08
  uMouse.y += (uMouseTarget.y - uMouse.y) * 0.08
  uniforms.uMouse.value.copy(uMouse)

  uniforms.uTime.value = t
  renderer.render(scene, camera)
  requestAnimationFrame(tick)
}
tick()
</script>
</body>
</html>
